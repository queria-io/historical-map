<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>過去の地図と統計 | Queria</title>
    <meta name="description" content="1945〜1990年の空中写真と当時の市町村の境界を今の地図と並べ、その町が今どうなったかを人口ピラミッドや年齢構成で比べられます。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Queria" />
    <meta property="og:title" content="過去の地図と統計" />
    <meta property="og:description" content="1945〜1990年の空中写真と当時の市町村の境界を今の地図と並べ、その町が今どうなったかを人口ピラミッドや年齢構成で比べられます。" />
    <meta property="og:url" content="https://historical-map.queria.io/" />
    <meta property="og:image" content="https://historical-map.queria.io/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <nav id="controls">
      <h1>過去の地図と統計</h1>
      <fieldset class="row">
        <legend>画面</legend>
        <label><input type="radio" name="screens" value="1" /> 1画面</label>
        <label><input type="radio" name="screens" value="2" checked /> 2画面</label>
      </fieldset>
      <label class="check"><input id="boundary" type="checkbox" checked /> <i class="key-old"></i>当時の境界線</label>
      <label class="check" id="now-boundary-field"><input id="now-boundary" type="checkbox" checked /> <i class="key-now"></i>今の境界線（右）</label>
      <label class="field">写真の不透明度
        <select id="opacity">
          <option value="1">100%</option>
          <option value="0.8">80%</option>
          <option value="0.6">60%</option>
          <option value="0.4">40%</option>
          <option value="0.2">20%</option>
          <option value="0">0%</option>
        </select>
      </label>
      <label class="field" id="current-field">右の地図
        <select id="current"></select>
      </label>
      <fieldset class="eras">
        <legend>年代
          <span class="step">
            <button id="prev" type="button" title="前の年代">▲</button>
            <button id="next" type="button" title="次の年代">▼</button>
          </span>
        </legend>
        <div id="eras"></div>
      </fieldset>
      <p class="hint">写真の無い地域があります。右の地図では今と当時の境界を重ねて表示します。左の市町村をクリックすると統計を表示し、右の地図にその形を太い破線で示します。</p>
      <a class="powered" href="https://queria.io/" target="_blank" rel="noopener">
        Powered by <span id="logo" role="img" aria-label="Queria"></span>
      </a>
    </nav>
    <main>
      <div id="maps">
        <div id="map"></div>
        <div id="map-now"></div>
      </div>
      <aside id="panel" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
